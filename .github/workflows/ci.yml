name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Build Backend (.NET)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore & Build
        run: |
          dotnet restore Backend/HardwareStorePortal.API/HardwareStorePortal.API.csproj
          dotnet build Backend/HardwareStorePortal.API/HardwareStorePortal.API.csproj --configuration Release --no-restore

  frontend:
    name: Build Frontend (Angular)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Frontend/hardware-store-frontend/package-lock.json

      - name: Install & Build
        working-directory: Frontend/hardware-store-frontend
        run: |
          npm ci
          npm run build
